[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence-agent"
version = "0.1.0"
description = "Local-first career intelligence for job search decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.30",
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.39",
    "torch>=2.4",
    "transformers>=4.45",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.3"]

[project.scripts]
career-agent = "career_agent.cli:app"

[tool.setuptools.packages.find]
include = ["career_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
